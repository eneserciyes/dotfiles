
set -a terminal-features "tmux-256color:rgb"
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g mouse on
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=blue bold"
set -g status-right ""
set -g status-left "#S"
set -g status-interval 5
set -g focus-events on
set -g history-limit 50000

bind f run "tmux neww ~/.local/bin/tmux-session-dispensary"
bind p run "tmux display-popup -E -w 60% -h 60% -d ~ zsh"
bind b set -g status
bind E show-environment -g
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Enter send -X copy-selection
bind r source-file "~/.config/tmux/tmux.conf"
bind s choose-tree -Zs

# pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Seamless nvim/tmux pane navigation with C-h/j/k/l (no prefix).
# If the focused pane is running (n)vim, pass the key through so vim moves between
# its splits; otherwise switch tmux panes. Pairs with christoomey/vim-tmux-navigator.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# C-l no longer clears the screen (it navigates now); restore it under the prefix.
bind C-l send-keys 'C-l'

# pane resizing with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# better splits
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v
bind = select-layout tiled

# kill pane without confirmation
bind x kill-pane

# kill all windows except the current one
bind o kill-window -a
